<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agregador de Notícias - CI/CD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }

    .version {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-bottom: 30px;
    }

    .api-status {
      background: #f0fff4;
      border: 1px solid #43e97b;
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 25px;
      font-size: 14px;
      color: #276749;
    }

    .api-status strong {
      display: block;
      margin-bottom: 4px;
    }

    #resposta-v1 {
      font-style: italic;
      color: #555;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      color: #1a1a1a;
    }

    .btn-primary:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #667eea;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6fe0;
      transform: translateY(-1px);
    }

    .form-group {
      margin-bottom: 20px;
      display: grid;
      gap: 10px;
    }

    label {
      font-weight: 600;
      color: #333;
      display: block;
    }

    input, textarea {
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      width: 100%;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-submit {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px 30px;
      width: 100%;
      font-size: 15px;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    #mensagem {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-weight: 600;
    }

    #noticias {
      display: grid;
      gap: 15px;
    }

    .noticia {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      transition: box-shadow 0.2s;
    }

    .noticia:hover {
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .noticia h3 {
      color: #333;
      margin-bottom: 8px;
    }

    .noticia p {
      color: #666;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .noticia-meta {
      display: flex;
      gap: 15px;
      font-size: 12px;
      color: #999;
      flex-wrap: wrap;
    }

    .categoria {
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      color: #1a1a1a;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      color: #999;
      padding: 30px;
    }

    .btn-delete {
      background: #ff6b6b;
      color: white;
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 4px;
    }

    .btn-delete:hover {
      background: #e05555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📰 Agregador de Notícias</h1>
    <p class="version">v1.1.0 — Servido por Nginx em container Docker</p>

    <div class="api-status">
      <strong>🔗 Status da API (rota /v1):</strong>
      <span id="resposta-v1">Consultando API...</span>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="carregarNoticias()">🔄 Atualizar Notícias</button>
      <button class="btn-secondary" onclick="chamarAPIv1()">🌐 Consultar /v1</button>
    </div>

    <div class="form-group">
      <label for="titulo">Título da Notícia</label>
      <input type="text" id="titulo" placeholder="Digite o título..." />

      <label for="descricao">Descrição</label>
      <textarea id="descricao" placeholder="Digite a descrição..."></textarea>

      <label for="categoria">Categoria</label>
      <input type="text" id="categoria" placeholder="Ex: Tecnologia, Esportes..." />

      <button class="btn-submit" onclick="adicionarNoticia()">➕ Adicionar Notícia</button>
    </div>

    <div id="mensagem"></div>
    <div id="noticias"><div class="loading">⏳ Carregando notícias...</div></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
